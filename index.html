<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvitacionModerna</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/responsive.css">
    <link rel="stylesheet" href="./assets/css/variables.css">
  </head>
  <body class="center">
    <!-- Todos los textos, fotos y links se editan en contenido.json; aquí solo van variables -->
    <template id="plantilla">
    <div class="content">
      <section class="section-home">
        <div class="home-title center">
          <img src="{{portada.iconoAnillos}}" alt="{{portada.iconoAnillosAlt}}">
          <h1>{{portada.evento}}</h1>
        </div>
        <div class="home-content">
          <img class="home-img" alt="{{portada.fotoAlt}}" src="{{portada.foto}}">
          <div class="box-audio">
            <div class="container">
              <div class="row">
                <div class="play-music">
                  <div id="music-animation" class="music-animation">
                    <span class="bar bar1"></span>
                    <span class="bar bar2"></span>
                    <span class="bar bar3"></span>
                    <span class="bar bar4"></span>
                    <span class="bar bar5"></span>
                  </div>
                  <div class="music-toggle">
                    <a onclick="togglePlay()" id="toggle" data-text-swap="{{portada.botonMusicaEncendida}}">{{portada.botonMusicaApagada}}</a>
                  </div>
                </div>
              </div>
            </div>
            <audio id="music" autoplay="autoplay" loop="loop">
              <source src="{{portada.musica}}" type="audio/mpeg">
              {{portada.musicaSinSoporte}}
            </audio>
          </div>
          <div class="home-txt">
            <b>{{portada.bienvenidaTitulo}}</b>
            <p>{{portada.bienvenidaTexto}}</p>
          </div>
        </div>
      </section>

      <section class="section-info">
        <div class="overlay-section-info">
          <span></span>
          <span></span>
        </div>
        <div class="box-info">
          <div class="info-primary">
            <h1>{{invitacion.nombres}}</h1>
            <p>{{invitacion.frase}}</p>
          </div>
          <div class="info-secundary">
            {{#invitacion.familia}}
            <div class="info-content">
              <b>{{titulo}}</b>
              <ul>
                <li>{{nombre1}}</li>
                <li>{{nombre2}}</li>
              </ul>
            </div>
            {{/invitacion.familia}}
            
          </div>
          <div class="section-date">
            <div class="date-info center">
              <img width="75" src="{{invitacion.iconoAnillos}}" alt="{{invitacion.iconoAnillosAlt}}">
              <p class="date-text">{{invitacion.fraseFecha}}</p>
            </div>
            <div class="date-box">
              <h2>{{invitacion.dia}}</h2>
              <ul class="center">
                <li>{{invitacion.mes}}</li>
                <li>{{invitacion.diaNumero}}</li>
                <li>{{invitacion.hora}}</li>
              </ul>
            </div>
            <ul class="date-time">
              <li>
                <div class="time_number" id="dias"></div>
                <div class="time_txt">{{invitacion.dias}}</div>
              </li>
              <li>
                <div class="time_number" id="horas"></div>
                <div class="time_txt">{{invitacion.horas}}</div>
              </li>
              <li>
                <div class="time_number" id="minutos"></div>
                <div class="time_txt">{{invitacion.minutos}}</div>
              </li>
              <li>
                <div class="time_number" id="segundos"></div>
                <div class="time_txt">{{invitacion.segundos}}</div>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <div class="calendar-box">
        <h3>{{calendario.titulo}}</h3>

        <div class="calendar">
          <div class="calendar-header" id="calendarioMes"></div>

          <div class="calendar-days">{{calendario.diasSemana}}</div>

          <div class="calendar-dates" id="calendarioDias"></div>
        </div>

        <a class="calendar-btn" id="calendarioBoton" href="#" target="_blank">
          <img src="{{calendario.icono}}" alt="">
          {{calendario.boton}}
        </a>
      </div>

      <section class="section-place">
        <div class="overlay-section-place">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="box-place">
          <div class="place-info center">
            <img width="75" src="{{ceremonia.icono}}" alt="{{ceremonia.iconoAlt}}">
            <div class="place-txt">
              <h2>{{ceremonia.titulo}}</h2>
              <p>{{ceremonia.lugar}}</p>
            </div>
          </div>
          <a class="place-btn" href="{{ceremonia.mapa}}" target="_blank">{{ceremonia.boton}}</a>
        </div>
      </section>

      <section class="section-place-salon">
        <div class="overlay-section-place">
          <span></span>
          <span></span>
        </div>
        <div class="box-place-salon">
          <div class="place-info center">
            <img width="105" src="{{recepcion.icono}}" alt="{{recepcion.iconoAlt}}">
            <div class="place-txt">
              <h2>{{recepcion.titulo}}</h2>
              <p>{{recepcion.lugar}}</p>
            </div>
          </div>
          <a class="place-btn" href="{{recepcion.mapa}}" target="_blank">{{recepcion.boton}}</a>
        </div>
      </section>

      <section class="section-slider">
        <div class="slider-photo">
          <figure>
            {{#galeria.fotos}}<div class="img" style="background-image: url('{{.}}')"></div>{{/galeria.fotos}}
          </figure>
        </div>
        <div class="slider-txt">
          <p>{{galeria.frase}}</p>
          <b>{{galeria.autor}}</b>
        </div>
      </section>

      <section class="section-padrinos">
        <div class="info-primary">
          <b>{{padrinos.titulo}}</b>
          <p>{{padrinos.texto}}</p>
        </div>
      </section>

      <section class="section-cronograma">
        <div class="cronograma-title">
          <img src="{{cronograma.icono}}" alt="{{cronograma.iconoAlt}}">
          <h2>{{cronograma.titulo}}</h2>
          <p>{{cronograma.descripcion}}</p>
        </div>

        <div class="timeline">
          {{#cronograma.actividades}}
          <div class="timeline-item">
            <div class="timeline-hour">{{hora}}</div>

            <div class="timeline-card">
              <img src="{{icono}}" alt="">
              <h3>{{actividad}}</h3>
              <p>{{descripcion}}</p>
            </div>
          </div>
          {{/cronograma.actividades}}

          

          

          

          
        </div>
      </section>

      <section class="section-info-adicional">
        <div class="info-clothes">
          <img height="60" src="{{infoAdicional.iconoVestimenta}}" alt="{{infoAdicional.iconoVestimentaAlt}}">
          <div class="clothes-txt">
            <h2>{{infoAdicional.vestimentaTitulo}}</h2>
            <p>{{infoAdicional.vestimentaTexto}}</p>
          </div>
        </div>
        <div class="info-separator">
          <img src="{{infoAdicional.separador}}" alt="{{infoAdicional.separadorAlt}}">
        </div>
        <div class="info-envelope">
          <img width="60" src="{{infoAdicional.iconoRegalos}}" alt="{{infoAdicional.iconoRegalosAlt}}">
          <div class="envelope-txt"></div>
          <h2>{{infoAdicional.regalosTitulo}}</h2>
          <p>{{infoAdicional.regalosTexto}}</p>
        </div>
      </section>

      <section class="section-message">
        <div class="overlay-section-message">
          <span></span>
          <span></span>
        </div>
        <div class="box-message">
          <p>{{confirmacion.frase}}</p>
          <b>{{confirmacion.agradecimiento}}</b>
          <button class="confirmar">
            <a href="{{confirmacion.link}}">{{confirmacion.boton}}</a>
          </button>
        </div>
      </section>
      <!-- Footer -->
      <footer>
        {{footer.texto}}
        <a href="{{footer.link}}" target="_blank">{{footer.marca}}</a>
        {{footer.anio}}
      </footer>
    </div>

      <script src="assets/js/main.js"></script>
    </template>

    <script src="assets/js/motor.js"></script>
  </body>
</html>
